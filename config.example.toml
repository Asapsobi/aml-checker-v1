# amlcheck configuration: every key with its default.
# Copy to ~/.amlcheck/config.toml (or point AMLCHECK_CONFIG at it) and keep only what you change.
# Unknown keys and invalid values are refused at load. Keys/secrets never go here: use .env.
# Defaults and meanings: docs/02-methodology.md; sections: docs/03-architecture.md §6.

# Methodology §2.1: when a required source counts as `stale`.
[freshness]
sanctions_max_age_hours = 48
tron_index_max_lag_minutes = 60

# Methodology §2.4 and D-011.
[network]
timeout_seconds = 20.0
max_retry_after_seconds = 10.0
max_pacer_wait_seconds = 65.0

# Severity overrides by rule ID (PRD §7.2). R-SYS-01 is fixed; inferences never BLOCK.
[rules]
# Severity overrides by rule ID, e.g.
# [rules.severity]
# "R-EXP-01" = "BLOCK"

# Methodology §3.1, §3.4.
[exposure]
# `lookback_days` is the required window; older history is read too (methodology §12.1, D-079):
# up to `max_transfers` in all, the older part within `history_extension_seconds`.
lookback_days = 180
max_transfers = 20000
history_extension_seconds = 45.0
flagged_inflow_share = 0.05
max_findings = 10

# Methodology §3.5.
[heuristics]
new_address_days = 7
pass_through_share = 0.9
pass_through_hours = 24
fan_window_hours = 24
fan_in_senders = 50
fan_in_small_usdt = 100
fan_out_recipients = 50
risky_tags = ["mixer", "bridge", "high_risk"]
allowlist_tag = "allowlist"
max_findings = 10

# Transfer cache and retention (data model, retention table).
[cache]
target_ttl_seconds = 60
history_keep_days = 30

# Methodology §5–§6, version 1.
[classifier]
window_days = 90
ttl_days = 14
min_confidence = 0.6
personal_confidence = 0.5
fresh_days = 7
heu07_min_confidence = 0.7
hub_min_counterparties = 500
deposit_min_senders = 2
deposit_top_recipient_share = 0.9
deposit_max_hold_hours = 72
deposit_max_retained_share = 0.05
deposit_bonus_min_senders = 5
deposit_bonus_max_hold_hours = 12
deposit_bonus_top_recipient_share = 0.99
collector_min_senders = 30
collector_small_in_share = 0.7
collector_top_recipient_share = 0.8
collector_bonus_min_senders = 100
collector_bonus_small_in_share = 0.9
collector_bonus_max_hold_hours = 24
distributor_min_recipients_24h = 30
distributor_max_senders = 3
distributor_bonus_min_recipients_24h = 100
distributor_bonus_round_share = 0.5
pass_through_share = 0.9
pass_through_min_volume_usdt = 1000
pass_through_bonus_share = 0.98
pass_through_bonus_max_hold_hours = 2
personal_max_counterparties = 50
round_unit_usdt = 100

# Methodology §7.1, with the v2 values of §12.2 (D-079 to D-081).
[trace]
# Every check traces both ways (D-079); with every_check = false, only from auto_amount_usdt.
every_check = true
auto_amount_usdt = 10000
max_hops = 5
# BSC traces stop at 3 hops: HyperSync's free plan can't reach 5 in 3 minutes (D-082).
bsc_max_hops = 3
branch = 5
coverage_share = 0.8
min_attributed_usdt = 100
# A small wallet's floor is at most this share of its own flow (D-096).
min_attributed_share = 0.01
hop_window_days = 30
# Addresses read per direction: 100 on TRON (D-090), 50 on BSC.
max_nodes = 100
bsc_max_nodes = 50
# Queued addresses read at once per direction (D-088): the same result as one at a time, sooner.
# BSC reads one at a time: HyperSync's free budget is spent per query.
parallel_reads = 4
bsc_parallel_reads = 1
time_budget_seconds = 180
hub_transfers = 1000
min_flagged_usdt = 1000
high_risk_share = 0.05
min_coverage = 0.5
inferred_share = 0.10

# Methodology §11.3 (score version 2, D-071, D-072). R-SCR-01 makes a REVIEW from `review_at`
# (31 = the Moderate floor; 0 turns it off). Each extra hop counts `decay` less (0 = no decay);
# `k` sets how fast exposure turns into points.
[score]
review_at = 31
decay = 0.4
k = 8
# An indirect exposure's volume: "path" = the smallest amount on its path, which every hop moved
# (D-078); "proportional" = the trace's proportional estimate (less sensitive).
indirect = "path"

# PRD F13.
[monitor]
rescreen_days = 7
trace_amount_usdt = 10000
# webhook_url = ""   # unset by default
max_senders_per_run = 10
first_lookback_hours = 24

# The local web UI (PRD F11.4): always on 127.0.0.1.
[web]
port = 8765

# Name recorded on decisions (Q-12).
[operator]
name = ""

# Data sources §2.
[ofac]
sdn_url = "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_XML.ZIP"
changes_url = "https://sanctionslistservice.ofac.treas.gov/changes/latest"
min_kept_share = 0.8

# Methodology §13.1 (D-084, D-085): sanctions lists beside OFAC. UK and EU are downloaded by
# `amlcheck sync` and required; NBCTF is imported from your files (`lists import-nbctf`).
[lists]
uk = true
eu = true
nbctf = true
uk_url = "https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.xml"
eu_url = "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content"
min_kept_share = 0.8

# Methodology §13.2 (D-086): a traced address that sent (tracing in) or received (tracing out)
# this share of its flow, and at least this much, to or from sanctioned or frozen addresses is a
# suspected neighbour: an inferred exposure at its hop, never BLOCK; the trace goes on through it.
[intel]
neighbour_share = 0.2
neighbour_min_usdt = 1000

# Data sources §3, §6. TronGrid limits are per key and unpublished: set them here.
[tron]
api_url = "https://api.trongrid.io"
usdt_contract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
requests_per_second = 10.0

# Data sources §4, §7.
[bsc]
hypersync_url = "https://bsc.hypersync.xyz"
hypersync_fallback_url = "https://56.hypersync.xyz"
usdt_contract = "0x55d398326f99059fF775485246999027B3197955"
seconds_per_block = 0.45
rpc_url = "https://bsc-dataseed.bnbchain.org"
rpc_requests_per_second = 2.0
