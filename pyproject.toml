[project]
name = "amlcheck"
version = "0.0.0"
description = "Counterparty intelligence for USDT on TRON and BNB Smart Chain"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "base58>=2.1",
    "eth-hash[pycryptodome]>=0.7",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
amlcheck = "amlcheck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The spec docs quote pseudocode written for reading, not for the formatter.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "DTZ",           # naive datetimes are bugs here (CLAUDE.md: time only from the injected clock)
    "S",             # bandit
    "PT",            # pytest style
]
# Docs and messages quote the specs, which use typographic dashes, arrows and section signs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, fake keys, seeded randomness

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
